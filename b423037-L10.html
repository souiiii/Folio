<!DOCTYPE html>
<!--
  LAB 10 — ONLINE EXAMINATION SYSTEM / FOLIO
  Open this file directly in a modern browser. No setup or internet required.
  Demo: Evaluator demo > Begin demo > Fill sample answers > Review & submit.
  Use Test time-up to demonstrate automatic submission in 15 seconds.
  Results > Open evaluator view > Evaluate this answer confirms written marks.
  HTML, styling, question bank, grading engine, and UI logic are all embedded.
  Local storage retains the active exam and 20 recent reports in this browser.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#23483f">
  <meta name="description" content="Folio — a thoughtful, distraction-free online examination workspace.">
  <title>Folio — Your exam workspace</title>
  <!-- 1. Visual design, responsive layouts, and print styles -->
  <style>
:root{--bg:#f7f8f5;--paper:#fff;--ink:#263c34;--muted:#657064;--green:#244b3e;--green-hover:#193a2f;--sage:#eaf0e9;--line:#e3e7e0;--orange:#cd633f;--peach:#f7e6d9;--radius:15px;--shadow:0 8px 25px #283d3210;--sans:Arial,Helvetica,sans-serif;--serif:Georgia,'Times New Roman',serif}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit}
button,a,input,textarea,select{-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
a{color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #cf754d;outline-offset:4px}
button{color:inherit}
h1,h2,h3,h4,p{margin:0}
svg{width:20px;height:20px;flex-shrink:0;stroke-width:1.7}
button svg{pointer-events:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip-link{position:fixed;left:20px;top:-60px;background:var(--green);color:white;padding:12px;z-index:100}
.skip-link:focus{top:10px}
.layout{min-height:100vh;display:grid;grid-template-columns:232px minmax(0,1fr)}
.sidebar{position:sticky;top:0;height:100vh;background:#f0f2ec;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:36px 22px 20px}
.brand{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:0 10px;color:var(--green)}
.brand-name{font-family:var(--serif);font-size:39px;line-height:1;letter-spacing:-2px}
.brand-mark{width:31px;height:36px;display:grid;grid-template-columns:repeat(2,1fr);gap:3px;transform:rotate(-7deg)}
.brand-mark i{background:var(--green);border-radius:2px 7px 2px 2px}
.brand-mark i:nth-child(2){opacity:.5}
.brand-mark i:nth-child(3){opacity:.7}
.brand-caption{font-size:10px;color:var(--muted);letter-spacing:1.6px;text-transform:uppercase;margin:14px 10px 43px}
.nav-label,.eyebrow{font-size:10px;font-weight:700;letter-spacing:1.9px;text-transform:uppercase}
.nav-label{color:#879087;margin:0 13px 13px}
.nav-links{display:grid;gap:6px}
.nav-link{display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:13px 14px;text-align:left;border-radius:8px;color:#6a756d;font-size:13px}
.nav-link.active{color:var(--green);background:#e0e8dd;font-weight:700}
.nav-link:hover{background:#e5eae1}
.nav-link .nav-dot{width:7px;height:7px;background:var(--orange);border-radius:50%;margin-left:auto}
.sidebar-note{margin:auto 5px 24px;padding-top:35px}
.sidebar-note .sprig{width:54px;height:58px;color:#7f917a;margin-bottom:12px}
.sidebar-note p{font:italic 20px/1.4 var(--serif);max-width:140px}
.sidebar-note small{display:block;color:var(--muted);font-size:11px;margin-top:10px}
.sidebar-footer{border-top:1px solid #dce2d8;padding:20px 9px 0;display:flex;align-items:center;gap:10px}
.avatar{height:33px;width:33px;display:grid;place-items:center;background:#e2e7dd;border-radius:50%;font-size:12px;font-weight:bold}
.sidebar-footer b{font-size:12px;display:block}
.sidebar-footer small{font-size:10px;color:var(--muted)}
.workspace{min-width:0}
.topbar{height:79px;padding:0 44px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:#fafbf8;gap:16px}
.breadcrumbs{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted)}
.breadcrumbs span:last-child{color:var(--ink)}
.breadcrumbs svg{width:13px}
.topbar-actions{display:flex;gap:16px;align-items:center}
.status-dot{width:6px;height:6px;border-radius:50%;background:#759174;display:inline-block;margin-right:6px}
.local-badge{font-size:11px;color:var(--muted);white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:12px 20px;border-radius:7px;border:1px solid transparent;font-size:12px;line-height:1.5;font-weight:600;text-decoration:none;transition:background .15s,transform .15s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn.primary{background:var(--green);color:white}
.btn.primary:hover{background:var(--green-hover)}
.btn.secondary{background:white;border-color:var(--line)}
.btn.secondary:hover{border-color:#a7b5a3;background:#f9faf6}
.btn.ghost{background:transparent;padding:9px 10px}
.btn.ghost:hover{background:var(--sage)}
.btn.orange{background:var(--orange);color:white}
.btn.small{padding:8px 13px;font-size:11px}
.btn.danger{color:#a54231;background:#fcf0eb;border-color:#f0d0c8}
.btn svg{width:16px;height:16px}
.text-link{border:0;background:none;color:var(--green);display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;padding:3px 0;text-decoration:none}
.text-link:hover{text-decoration:underline}
.text-link svg{width:15px}
.icon-button{border:1px solid var(--line);border-radius:7px;background:white;width:35px;height:35px;display:inline-grid;place-items:center}
.icon-button:hover{background:var(--sage)}
.content{max-width:1360px;margin:auto;padding:39px 44px 25px;animation:appear .3s ease}
.page-heading{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:28px}
.eyebrow{color:#7b897b;margin-bottom:10px}
.page-heading h1{font:400 39px/1.16 var(--serif);letter-spacing:-1.1px}
.page-heading p{color:var(--muted);font-size:12px;margin-top:10px}
.date-label{font-size:11px;color:var(--muted);padding-bottom:5px;white-space:nowrap}
.hero{background:#e9eee5;border:1px solid #e0e6db;display:grid;grid-template-columns:1fr 270px;border-radius:var(--radius);min-height:221px;padding:31px 33px;overflow:hidden;position:relative}
.hero-copy{z-index:1}
.hero .eyebrow{font-size:9px;letter-spacing:2px;color:#677c66;margin-bottom:13px}
.hero h2{font:400 33px/1.2 var(--serif);letter-spacing:-.6px}
.hero h2 em{color:#74836b;font-weight:400}
.hero p{color:#74806f;font-size:12px;max-width:390px;margin-top:12px;line-height:1.7}
.hero-bottom{display:flex;gap:18px;align-items:center;margin-top:23px}
.hero-bottom .micro-note{font-size:10px;color:#71806c}
.hero-art{height:190px;position:absolute;right:37px;top:26px;width:230px}
.hero-art svg{width:100%;height:100%;stroke-width:1}
.hero-art .art-caption{font-size:9px;letter-spacing:2.4px;text-align:center;color:#5a6f58;margin-top:-2px}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:30px 0 16px;gap:15px}
.section-title h2{font-size:16px;font-weight:600;letter-spacing:-.3px}
.section-title small{color:var(--muted);font-size:11px}
.dashboard-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(265px,1fr);gap:20px}
.paper-card{border:1px solid var(--line);border-radius:var(--radius);background:white;overflow:hidden}
.paper-card-body{padding:25px 27px}
.card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:19px;gap:10px}
.subject-icon{width:40px;height:40px;display:grid;place-items:center;background:#edf0e9;border-radius:10px;color:#627459}
.subject-icon svg{width:23px;height:23px}
.pill{font-size:9px;letter-spacing:.3px;font-weight:600;padding:4px 9px;display:inline-flex;align-items:center;gap:5px;border-radius:5px;white-space:nowrap;background:var(--sage);color:#52734e}
.pill.peach{background:#faece2;color:#ab6844}
.pill.neutral{background:#f0f2ee;color:#7c8479}
.pill.red{background:#fbe9e4;color:#a34738}
.paper-code{color:#90958b;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:5px}
.paper-card h3{font:400 25px/1.3 var(--serif);letter-spacing:-.4px}
.paper-card .description{font-size:11px;line-height:1.8;color:var(--muted);margin-top:8px;max-width:360px}
.paper-stats{display:flex;gap:22px;flex-wrap:wrap;margin:23px 0 19px}
.paper-stats span{display:flex;gap:7px;align-items:center;font-size:11px;color:#647061}
.paper-stats svg{width:15px;height:15px}
.tag-row{display:flex;gap:7px;flex-wrap:wrap}
.tag{font-size:9px;border:1px solid #e8ebe4;color:#7a8274;border-radius:4px;padding:3px 7px}
.paper-card-footer{padding:17px 27px;background:#fbfcf9;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
.readiness-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:24px}
.readiness-card h3{font:400 21px var(--serif);margin-bottom:5px}
.readiness-card>p{font-size:11px;color:var(--muted)}
.readiness-list{display:grid;gap:20px;margin-top:26px}
.readiness-item{display:flex;gap:12px}
.readiness-item .mini-icon{width:30px;height:30px;display:grid;place-items:center;background:#f5f5f0;border-radius:50%;color:#7d8c76;flex-shrink:0}
.mini-icon svg{width:15px;height:15px}
.readiness-item h4{font-size:11px;margin:0 0 3px}
.readiness-item p{font-size:10px;color:var(--muted);line-height:1.65}
.guide-link{margin-top:22px;font-size:10px;color:#697a62}
.feature-row{display:grid;grid-template-columns:repeat(3,1fr);gap:17px;margin-top:23px}
.feature{display:flex;gap:11px;padding:17px 0}
.feature>svg{width:19px;color:#87987d;margin-top:2px}
.feature h4{font-size:11px;margin-bottom:3px;font-weight:600}
.feature p{color:var(--muted);font-size:10px;line-height:1.7}
.page-footer{display:flex;justify-content:space-between;gap:15px;border-top:1px solid var(--line);margin-top:16px;padding-top:17px;font-size:9px;color:#969d91}
.footer-heart{color:var(--orange)}
.notice{display:flex;align-items:flex-start;gap:12px;padding:15px 19px;border:1px solid #e1e7da;border-radius:9px;background:#f0f4ec;font-size:12px;color:#5b7054;margin-bottom:22px}
.notice svg{margin-top:1px;width:18px}
.notice p{flex:1}
.notice.peach{background:#fdf0e5;border-color:#f0dfce;color:#976647}
.notice .btn{flex-shrink:0}
.heading-actions{display:flex;gap:9px;align-items:center}
.paper-overview{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;background:white;border:1px solid var(--line);border-radius:12px;padding:22px 25px;margin-bottom:26px}
.paper-overview span{color:var(--muted);font-size:10px;display:block}
.paper-overview strong{font-weight:500;font-size:20px;display:block;margin-top:3px}
.preview-section{margin-bottom:25px}
.preview-section h2{font:25px var(--serif);margin-bottom:5px}
.preview-section>p{font-size:12px;color:var(--muted);margin-bottom:20px}
.preview-question{padding:23px 25px;background:white;border:1px solid var(--line);border-radius:10px;margin:12px 0;break-inside:avoid}
.question-heading{display:flex;justify-content:space-between;gap:15px;align-items:start}
.preview-question h3{font-size:14px;font-weight:500}
.preview-question .prompt{color:var(--muted);font-size:12px;margin-top:8px}
.preview-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;color:var(--muted);font-size:12px}
.preview-options span{padding:9px 12px;background:#f7f8f5;border-radius:5px}
.code{display:block;padding:17px 20px;background:#273b34;border-radius:8px;color:#dbe8d5;font:13px/1.7 'Courier New',monospace;white-space:pre-wrap;margin:18px 0;overflow-wrap:anywhere}
.answer-lines{height:70px;background:repeating-linear-gradient(transparent,transparent 27px,#e9ece5 28px);margin-top:12px}
.exam-header{align-items:center}
.exam-header h1{font-size:29px}
.exam-header .eyebrow{margin-bottom:6px}
.exam-header p{font-size:11px;margin-top:5px}
.timer-wrap{display:flex;align-items:center;gap:12px;padding:11px 17px;border:1px solid #dce5d5;border-radius:9px;background:#edf2e8;min-width:151px}
.timer-wrap>svg{width:23px;height:23px;color:#637c54}
.timer-wrap .timer-label{font-size:9px;color:#76856d;letter-spacing:.7px;text-transform:uppercase}
.timer-value{font:500 24px/1.2 var(--sans);font-variant-numeric:tabular-nums;letter-spacing:1px}
.timer-wrap.warning{background:#fcf0e1;border-color:#edc995;color:#a26a22}
.timer-wrap.urgent{background:#fbe8e3;border-color:#e5b4a8;color:#b03b2c}
.exam-layout{display:grid;grid-template-columns:minmax(0,1fr) 262px;gap:23px;align-items:start}
.question-card{background:white;border:1px solid var(--line);border-radius:13px;overflow:hidden}
.question-top{padding:19px 25px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);gap:12px}
.question-top .number{font-size:12px;font-weight:600}
.question-top .number span{color:#9ca498;font-weight:400;margin-left:4px}
.question-body{padding:29px 29px 27px;min-height:390px}
.question-meta{display:flex;gap:8px;margin-bottom:17px}
.question-body h2{font:400 24px/1.45 var(--serif);letter-spacing:-.3px}
.question-body>p{font-size:12px;color:var(--muted);margin-top:10px}
.options{display:grid;gap:11px;margin-top:27px}
.option{display:flex;gap:13px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:14px 16px;cursor:pointer;font-size:12px;transition:.15s;background:#fff}
.option:hover{border-color:#acbba1;background:#fafbf8}
.option:has(input:checked){border-color:#64815a;background:#edf3e8;box-shadow:0 0 0 1px #64815a}
.option input{width:16px;height:16px;accent-color:var(--green);margin:0;flex-shrink:0}
.option-letter{color:#9bA293;font-size:10px}
.option .option-text{flex:1;overflow-wrap:anywhere}
.option:has(input:checked) .option-text{color:var(--green);font-weight:600}
.textarea-label{display:block;margin-top:24px;margin-bottom:8px;font-size:12px;font-weight:600}
.answer-field{display:block;width:100%;resize:vertical;min-height:235px;padding:17px;border:1px solid #dce3d5;border-radius:8px;background:#fcfdfb;line-height:1.9;font-size:14px;color:var(--ink)}
.answer-field::placeholder{color:#a6ada0}
.answer-meta{display:flex;justify-content:space-between;gap:10px;margin-top:9px;font-size:10px;color:var(--muted)}
.answer-field.large-text,.large-text .question-body{font-size:17px}
.large-text .question-body h2{font-size:28px}
.large-text .option{font-size:15px}
.large-text .answer-field{font-size:17px}
.question-bottom{border-top:1px solid var(--line);padding:17px 25px;display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fcfdfb}
.question-controls{display:flex;gap:8px}
.flag-button.flagged{color:#ac6b26;background:#f9eedc;border-color:#e8cfac}
.exam-aside{display:grid;gap:15px}
.navigator{padding:21px;background:white;border:1px solid var(--line);border-radius:12px}
.navigator h3{font-size:13px}
.progress-label{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:11px}
.progress-track{height:4px;border-radius:10px;background:#edf0e8;margin:8px 0 21px;overflow:hidden}
.progress-fill{height:100%;background:#7f9972;border-radius:10px;transition:width .25s}
.navigator .eyebrow{font-size:8px;letter-spacing:1.2px;margin-bottom:9px}
.question-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:19px}
.question-tile{height:37px;position:relative;background:#f6f7f3;border:1px solid #e6e9e0;border-radius:6px;font-size:11px;transition:.15s}
.question-tile.visited{background:#fff;border-color:#b7c1af}
.question-tile.answered{background:#e0ebd9;border-color:#c4d5ba;color:#3f6635}
.question-tile.current{outline:2px solid var(--green);outline-offset:2px;font-weight:bold}
.question-tile.flagged:after{content:'';position:absolute;right:3px;top:3px;width:5px;height:5px;border-radius:50%;background:#cd893e}
.legend{display:grid;grid-template-columns:1fr 1fr;font-size:8px;color:#7d8975;gap:8px;margin-top:4px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border:1px solid #d7ddcf;background:#f6f7f3;border-radius:2px}
.legend .answered i{background:#d5e3cc;border-color:#b5c9a7}
.legend .flagged i{background:#cf934f;border-color:#cf934f}
.legend .current i{border-color:var(--green)}
.exam-submit{width:100%;margin-top:20px}
.save-status{font-size:10px;color:#86927d;display:flex;gap:6px;align-items:center;justify-content:center;margin-top:14px}
.save-status svg{width:13px;height:13px}
.exam-tip{padding:17px 20px;font-size:11px;color:#8b785e;border:1px solid #ecdfce;background:#fbf5eb;border-radius:10px}
.exam-tip h4{font-size:11px;margin-bottom:4px;color:#7b684e}
.exam-tools{display:flex;gap:8px;flex-wrap:wrap}
.exam-tools .btn{flex:1;font-size:10px;padding:9px}
.demo-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 15px;background:#f5eadd;border:1px dashed #dbc7ac;border-radius:8px;margin-bottom:19px;font-size:11px;color:#8a6948}
.demo-bar>div{display:flex;gap:7px}
.demo-bar .btn{font-size:10px;padding:6px 9px}
.modal-backdrop{position:fixed;inset:0;z-index:80;background:#20342b66;backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:24px;animation:appear .15s}
.modal{width:520px;max-width:100%;max-height:90vh;overflow:auto;background:#fff;border-radius:17px;box-shadow:0 20px 70px #11271b3b;padding:29px}
.modal.wide{width:690px}
.modal-header{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:21px}
.modal-header h2{font:29px var(--serif);letter-spacing:-.6px}
.modal-header .icon-button{border:0;background:#f2f4ee}
.modal-intro{font-size:12px;color:var(--muted);line-height:1.8;margin-bottom:20px}
.modal-stats{display:grid;grid-template-columns:repeat(3,1fr);background:#f1f5ec;border:1px solid #e1e8d8;border-radius:9px;padding:17px;margin-bottom:20px;text-align:center}
.modal-stats b{font-size:23px;display:block;font-weight:500}
.modal-stats small{font-size:10px;color:#7c8a73}
.instructions{list-style:none;display:grid;gap:13px;margin:0 0 23px;padding:0}
.instructions li{display:flex;gap:10px;font-size:12px;color:#76806f;line-height:1.7}
.instructions svg{width:17px;color:#7e916c;margin-top:2px}
.instructions b{color:#3e5137}
.checkbox-label{display:flex;gap:10px;align-items:flex-start;padding:14px;background:#f8f9f5;border:1px solid var(--line);border-radius:7px;font-size:11px;cursor:pointer}
.checkbox-label input{margin-top:3px;accent-color:var(--green);width:15px;height:15px;flex-shrink:0}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:23px}
.modal-actions .btn{min-width:100px}
.submission-list{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 18px}
.submission-list .btn{min-width:34px;font-size:10px;padding:6px 9px}
.modal h3{font-size:12px;margin:16px 0 5px}
.modal small{color:var(--muted)}
.field-label{font-size:12px;font-weight:600;display:block;margin:17px 0 6px}
.form-input{width:100%;padding:12px;border:1px solid #dce2d5;border-radius:7px;background:#fbfcf9;color:var(--ink)}
#toast{position:fixed;bottom:25px;left:calc(50% + 85px);transform:translate(-50%,20px);background:var(--green);color:#fff;box-shadow:var(--shadow);padding:11px 20px;border-radius:8px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:100;max-width:90vw;text-align:center}
#toast.visible{opacity:1;transform:translate(-50%,0)}
.empty-state{padding:60px 30px;text-align:center;border:1px solid var(--line);background:#fff;border-radius:13px}
.empty-state .empty-icon{display:grid;place-items:center;margin:0 auto 20px;width:70px;height:70px;border-radius:50%;background:var(--sage);color:#788f68}
.empty-icon svg{width:30px;height:30px}
.empty-state h2{font:30px var(--serif);margin-bottom:12px}
.empty-state p{color:var(--muted);font-size:12px;max-width:410px;margin:0 auto 23px}
.empty-state .btn{margin:4px}

  }
  function guidePage() {
    return `<div class="page-heading"><div><div class="eyebrow">Clarity comes first</div><h1>Fair marks. Clear reasoning.</h1><p>Here’s how the paper is evaluated, from your first answer to your final score.</p></div></div><div class="guide-grid"><section class="guide-card"><div class="subject-icon">${icon('checkCircle')}</div><h2>The marking scheme.</h2><p>The practice paper and assessment share this format, but use different questions. All questions carry positive marks. An incorrect or unanswered MCQ earns zero.</p><table class="grade-table"><thead><tr><th>Section</th><th>Questions</th><th>Marks</th></tr></thead><tbody><tr><td>Multiple choice</td><td>8 × 2</td><td>16</td></tr><tr><td>Written responses</td><td>4 × 6</td><td>24</td></tr><tr><td><b>Total</b></td><td>12</td><td><b>40</b></td></tr></tbody></table><p style="margin-top:15px">The pass threshold is <b>20 out of 40 (50%)</b>. No negative marking. MCQs are graded against a fixed answer key.</p></section><section class="guide-card"><div class="subject-icon">${icon('pen')}</div><h2>Words deserve a closer look.</h2><p>Each written response has three rubric criteria worth 2 marks each. Matching relevant terms generates an initial score suggestion.</p><ul><li>Scores are explicitly <b>provisional</b> until reviewed.</li><li>Keyword checks can miss good answers or reward incorrect statements. They are a guide for the evaluator.</li><li>The evaluator can award 0–6 marks, in half-mark increments, and leave feedback.</li><li>A submitted written answer needs evaluator review. An unanswered one receives zero automatically. The pass/fail outcome is released once all marks are confirmed.</li></ul></section><section class="guide-card"><div class="subject-icon">${icon('play')}</div><h2>A demo in two minutes.</h2><p>An easy walkthrough for your lab evaluator.</p><div class="steps"><div class="step"><div><b>Start the evaluator demo</b>Use the prefilled demo registration and start a 2-minute session with the practice question set.</div></div><div class="step"><div><b>Try the exam tools</b>Fill sample answers, flag a question, write a response, and refresh to see it restored.</div></div><div class="step"><div><b>Submit or test the timer</b>Use “Test time-up” to reduce the countdown to 15 seconds and watch automatic submission.</div></div><div class="step"><div><b>Review and confirm marks</b>Switch to evaluator view in the report, review each written answer, and confirm its marks. Return to learner view to show the final result.</div></div></div><div style="margin-top:23px">${btn('Launch evaluator demo', 'demo', 'primary', 'play')}</div></section><section class="guide-card"><div class="subject-icon">${icon('shield')}</div><h2>Your workspace, explained.</h2><ul><li><b>Practice, then assessment.</b> Practice includes solutions. Assessment questions are revealed only after you start. Retaking an assessment uses the same set and saves a separate report.</li><li><b>A small registration.</b> Name and roll number identify each report. No password or account is needed. Learner and evaluator views are demonstration roles in this shared workspace.</li><li><b>Local autosave.</b> Answers, notes, flags, and the timer are restored in the same browser when storage is available.</li><li><b>A continuous timer.</b> Leaving or refreshing the page does not pause the exam. An expired attempt submits as soon as this page is active again.</li><li><b>20 recent attempts.</b> Reports stay on this device. Export anything you want to keep.</li><li><b>Practice and demonstration.</b> All code and answer keys are inside this file. It is designed for a lab demo, not secure, proctored assessment.</li><li><b>Offline by design.</b> No internet connection, third-party requests, or server is needed.</li></ul></section></div>`;
  }
  function renderPage() { return ({ overview, paper: paperPage, exam: examPage, results: resultPage, guide: guidePage }[view] || overview)(); }
  function openModal(kind, title, body, actions, wide = false) {
    lastFocused = document.activeElement;
    modalKind = kind;
    $('#modal-root').innerHTML = `<div class="modal-backdrop"><section class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-header"><h2 id="modal-title">${title}</h2><button class="icon-button" data-action="close-modal" aria-label="Close dialog">${icon('close')}</button></div>${body}<div class="modal-actions">${actions}</div></section></div>`;
    $('#app').inert = true;
    document.body.style.overflow = 'hidden';
    requestAnimationFrame(() => { const el = $('[autofocus]', $('#modal-root')) || $('button', $('#modal-root')); el?.focus(); });
  }
  function closeModal() {
    if (!modalKind) return;
    modalKind = ''; modalQuestion = '';
    $('#modal-root').innerHTML = ''; $('#app').inert = false; document.body.style.overflow = '';
    if (lastFocused?.isConnected) lastFocused.focus({ preventScroll: true });
  }
  function startDialog(demo) {
    if (state.active) {
      openModal('resume', 'Your exam is waiting.', '<p class="modal-intro">You already have an examination in progress. Resume and submit it before starting a new session. Your answers and remaining time are preserved.</p>', btn('Keep exploring', 'close-modal', 'secondary') + btn('Resume exam', 'resume', 'primary', 'arrow'));
      return;
    }
    const candidate = demo ? { name: 'Demo Student', roll: 'DEMO-001' } : state.history.find(a => !a.demo && a.candidate)?.candidate || { name: '', roll: '' };
    openModal(demo ? 'start-demo' : 'start', demo ? 'Try the complete experience.' : 'A quick registration.', `<p class="modal-intro">${demo ? 'A 2-minute walkthrough using the practice set. Demo details are prefilled so you can get straight to the exam tools.' : 'Just two details for your exam record. The timer starts only when you click “Begin examination”.'}</p><form id="registration-form" class="registration-form"><div><label for="candidate-name">Full name <span aria-hidden="true">*</span></label><input id="candidate-name" name="candidate-name" class="form-input" type="text" autocomplete="name" maxlength="80" required placeholder="e.g. Aditi Sharma" value="${esc(candidate.name)}"></div><div><label for="candidate-roll">Roll / student ID <span aria-hidden="true">*</span></label><input id="candidate-roll" name="candidate-roll" class="form-input" type="text" autocomplete="off" maxlength="30" required placeholder="e.g. B423037" value="${esc(candidate.roll)}"></div></form><div class="modal-stats"><div><b>${demo ? practicePaper.demoMinutes : paper.minutes}</b><small>MINUTES</small></div><div><b>12</b><small>QUESTIONS</small></div><div><b>40</b><small>MARKS</small></div></div><ul class="instructions compact-instructions"><li>${icon('paper')}<span>${demo ? '<b>Practice questions.</b> Fill prepared answers or shorten the timer to demonstrate submission.' : '<b>A separate assessment.</b> 8 MCQs and 4 written answers, different from the practice set. No negative marking.'}</span></li><li>${icon('clock')}<span><b>The timer runs continuously.</b> Refreshing won’t pause it. Answers submit automatically when time expires.</span></li><li>${icon('shield')}<span>${demo ? '<b>Demo report.</b> Written scores need evaluator confirmation.' : '<b>Study materials close during the exam.</b> Your name, ID, and progress stay saved on this device.'}</span></li></ul><label class="checkbox-label"><input type="checkbox" id="accept-instructions"><span>I’ve checked my details and read the examination instructions.</span></label>`, btn('Not just yet', 'close-modal', 'secondary') + btn(demo ? 'Begin demo' : 'Begin examination', demo ? 'begin-demo' : 'begin-exam', 'primary', 'arrow', 'id="begin-button" disabled'));
  }
  function begin(demo) {
    if (!$('#accept-instructions')?.checked || state.active) return;
    const form = $('#registration-form'), name = $('#candidate-name'), roll = $('#candidate-roll');
    if (!form || !name || !roll) return;
    name.setCustomValidity(name.value.trim() ? '' : 'Please enter your full name.');
    roll.setCustomValidity(roll.value.trim() ? '' : 'Please enter your roll number or student ID.');
    if (!form.reportValidity()) return;
    state.active = E.createAttempt(demo);
    state.active.candidate = { name: name.value.trim().replace(/\s+/g, ' '), roll: roll.value.trim() };
    lastTimeAnnounced = ''; save(); navigate('exam');
    toast(demo ? 'Your 2-minute practice demo has started.' : 'Registration complete. Your 30-minute examination has started.');
  }
  function updateNavigator() { if ($('#navigator-root') && state.active) $('#navigator-root').innerHTML = navigator(); }
  function liveAttempt() { if (state.active && E.secondsLeft(state.active) <= 0) { submit(true); return false; } return !!state.active; }
  function moveQuestion(index) {
    if (!liveAttempt()) return;
    const a = state.active, paper = E.getPaper(a);
    a.current = Math.max(0, Math.min(11, index));
    if (!a.visited.includes(paper.questions[a.current].id)) a.visited.push(paper.questions[a.current].id);
    save(); closeModal(); render(); $('#question-title')?.setAttribute('tabindex', '-1'); $('#question-title')?.focus({ preventScroll: true });
    if (window.innerWidth < 961) $('.question-card')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  function toggleFlag() {
    if (!liveAttempt()) return;
    const a = state.active, id = activePaper().questions[a.current].id;
    const exists = a.flags.includes(id); a.flags = exists ? a.flags.filter(f => f !== id) : [...a.flags, id];
    save(); updateNavigator();
    const button = $('.flag-button');
    if (button) { button.classList.toggle('flagged', !exists); button.setAttribute('aria-pressed', String(!exists)); button.innerHTML = icon('flag') + (exists ? 'Flag for review' : 'Flagged for review'); }
    toast(exists ? 'Question removed from your review list.' : 'Question flagged. Come back when you’re ready.');
  }
  function reviewSubmission() {
    if (!liveAttempt()) return;
    const a = state.active, paper = E.getPaper(a), unanswered = paper.questions.filter(q => !E.answered(q, a.answers[q.id]));
    openModal('submit', 'Ready to turn the page?', `<p class="modal-intro">Take one last look before submitting. You can return to any question while time remains. Submitted answers cannot be changed.</p><div class="modal-stats"><div><b>${answeredCount(a)}</b><small>ANSWERED</small></div><div><b>${unanswered.length}</b><small>UNANSWERED</small></div><div><b>${a.flags.length}</b><small>FLAGGED</small></div></div>${unanswered.length ? `<h3>Still waiting for an answer</h3><p class="inline-note">Unanswered questions receive zero automatic marks.</p><div class="submission-list">${unanswered.map(q => btn(String(paper.questions.indexOf(q) + 1).padStart(2, '0'), 'question', 'secondary', '', `data-index="${paper.questions.indexOf(q)}" aria-label="Return to unanswered question ${paper.questions.indexOf(q) + 1}"`)).join('')}</div>` : '<div class="notice" style="margin:0">' + icon('checkCircle') + '<p>All 12 questions answered. Nicely done.</p></div>'}${a.flags.length ? `<h3>Flagged for a second look</h3><div class="submission-list">${a.flags.map(id => { const i = paper.questions.findIndex(q => q.id === id); return btn(String(i + 1).padStart(2, '0'), 'question', 'secondary', 'flag', `data-index="${i}"`); }).join('')}</div>` : ''}<p class="inline-note">The timer keeps running while you review this summary.</p>`, btn('Keep working', 'close-modal', 'secondary') + btn('Submit examination', 'confirm-submit', 'primary', 'checkCircle'));
  }
  function submit(auto = false) {
    if (!state.active) return;
    const a = state.active;
    if (E.secondsLeft(a) === 0) auto = true;
    a.submittedAt = auto ? a.deadline : Date.now(); a.autoSubmitted = auto;
    state.history = [a, ...state.history.filter(item => item.id !== a.id)].slice(0, 20); state.selectedResult = a.id; state.active = null; filter = 'all'; evaluatorMode = false;
    save(); navigate('results');
    toast(auto ? 'Time’s up. Your answers have been submitted automatically.' : 'Examination submitted. Your feedback is ready.');
    $('#announcer').textContent = auto ? 'Time has expired. Your examination was automatically submitted.' : 'Your examination has been submitted.';
  }
  function updateTimer() {
    if (!state.active) return;
    const seconds = E.secondsLeft(state.active);
    if (!seconds) { submit(true); return; }
    const el = $('#timer-value');
    if (el) { el.textContent = formatTime(seconds); el.setAttribute('aria-label', `${Math.floor(seconds / 60)} minutes and ${seconds % 60} seconds remaining`); }
    const wrap = $('#timer-wrap');
    if (wrap) { wrap.classList.toggle('warning', seconds <= 300 && seconds > 60); wrap.classList.toggle('urgent', seconds <= 60); }
    const threshold = seconds <= 30 ? '30 seconds' : seconds <= 60 ? '1 minute' : seconds <= 300 && !state.active.demo ? '5 minutes' : '';
    if (threshold && threshold !== lastTimeAnnounced) { lastTimeAnnounced = threshold; $('#announcer').textContent = `${threshold} remaining in your examination.`; toast(`${threshold} remaining. Your answers will submit automatically when time is up.`); }
  }
  function scratchpad() {
    if (!liveAttempt()) return;
    openModal('scratchpad', 'Room for rough thoughts.', `<p class="modal-intro">A private scratchpad for this attempt. Notes save automatically and aren’t graded. Your exam timer keeps running.</p><label class="field-label" for="scratchpad-notes">Your notes</label><textarea class="answer-field" id="scratchpad-notes" maxlength="20000" placeholder="Jot down a thought, work through a problem…" autofocus>${esc(state.active.notes)}</textarea><p class="inline-note">These notes are included in your exported attempt.</p>`, btn('Back to examination', 'close-modal', 'primary', 'arrow'), true);
  }
  function evaluate(id) {
    const a = currentResult(), paper = E.getPaper(a), q = paper.questions.find(q => q.id === id);
    if (!evaluatorMode || !a || !q || q.type !== 'written' || !E.answered(q, a.answers[id])) return;
    const row = E.scoreQuestion(q, a.answers[id], a.overrides[id]);
    openModal('evaluate', `Evaluate question ${paper.questions.indexOf(q) + 1}`, `<p class="modal-intro">${esc(q.title)}<br>Judge the complete response for accuracy, clarity, and coverage of the prompt. You may adjust the suggested score.</p><h3>Submitted response</h3><div class="review-answer">${esc(a.answers[id] || 'No answer submitted.')}</div><h3>Rubric · 2 marks per criterion</h3><div class="rubric-list">${row.criteria.map(c => `<div class="rubric-row ${c.matched ? 'matched' : ''}">${icon(c.matched ? 'checkCircle' : 'info')}<span>${esc(c.label)}</span><b>${c.matched ? 'Term detected' : 'No term detected'}</b></div>`).join('')}</div><label class="field-label" for="review-score">Confirmed marks (0–6, half marks allowed)</label><input class="form-input" id="review-score" type="number" min="0" max="6" step="0.5" value="${row.earned}" required><label class="field-label" for="review-feedback">Feedback <span style="font-weight:400;color:var(--muted)">(optional)</span></label><textarea class="form-input" id="review-feedback" rows="3" maxlength="2000" placeholder="What worked well? What could be clearer?">${esc(row.feedback)}</textarea><p class="inline-note">This confirms the marks for this answer, including when you keep the suggested score.</p>`, btn('Cancel', 'close-modal', 'secondary') + btn('Confirm evaluation', 'save-evaluation', 'primary', 'checkCircle'), true);
    modalQuestion = id;
  }
  function saveEvaluation() {
    const a = currentResult(), input = $('#review-score');
    if (!evaluatorMode || !a || !input || !input.reportValidity()) return;
    const score = input.valueAsNumber;
    if (!Number.isFinite(score) || score < 0 || score > 6 || score * 2 % 1 !== 0) return;
    a.overrides[modalQuestion] = { score, feedback: $('#review-feedback').value.trim(), reviewedAt: Date.now() };
    save(); closeModal(); filter = 'written'; render(); toast('Evaluation saved. Your total has been updated.');
  }
  function fillDemo() {
    if (!liveAttempt() || !state.active.demo) return;
    state.active.answers = E.sampleAnswers(); save(); closeModal(); render(); toast('Sample responses filled: 6 correct MCQs and a mix of written answers.');
  }
  function sampleReport() {
    const now = Date.now(), a = E.createAttempt(true, now - 90000);
    a.candidate = { name: 'Demo Student', roll: 'DEMO-001' }; a.answers = E.sampleAnswers(); a.submittedAt = now; a.visited = E.getPaper(a).questions.map(q => q.id);
    state.history = [a, ...state.history].slice(0, 20); state.selectedResult = a.id; save(); filter = 'all'; evaluatorMode = false; navigate('results'); toast('Practice report loaded. Open evaluator view to review the written responses.');
  }
  function exportReport() {
    const a = currentResult(); if (!a) return;
    const paper = E.getPaper(a), g = E.grade(a);
    const report = { application: 'Folio', paper: paper.title, paperCode: paper.code, resultStatus: g.provisional ? 'Awaiting evaluation' : 'Final', exportedAt: new Date().toISOString(), attempt: a, result: g, responses: paper.questions.map((q, i) => ({ question: q.title, type: q.type, answer: q.type === 'mcq' ? q.options[a.answers[q.id]] || null : a.answers[q.id] || null, correctOrModelAnswer: q.type === 'mcq' ? q.options[q.correct] : q.model, grading: g.rows[i] })) };
    const url = URL.createObjectURL(new Blob([JSON.stringify(report, null, 2)], { type: 'application/json' }));
    const link = document.createElement('a'); link.href = url; link.download = `folio-${a.demo ? 'demo' : 'exam'}-${a.id}.json`; document.body.appendChild(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 15000); toast('Your report has been exported.');
  }
  document.addEventListener('click', event => {
    const target = event.target.closest('[data-action]');
    if (!target || target.disabled) return;
    const action = target.dataset.action;
    if (state.active && E.secondsLeft(state.active) === 0 && !['close-modal', 'nav'].includes(action)) { submit(true); return; }
    switch (action) {
      case 'nav': navigate(target.dataset.view); break;
      case 'menu': { const sidebar = $('#sidebar'), open = sidebar.classList.toggle('open'); target.setAttribute('aria-expanded', String(open)); break; }
      case 'start': case 'retake': startDialog(false); break;
      case 'demo': startDialog(true); break;
      case 'begin-exam': begin(false); break;
      case 'begin-demo': begin(true); break;
      case 'close-modal': closeModal(); break;
      case 'resume': navigate('exam'); break;
      case 'next': if (state.active) moveQuestion(state.active.current + 1); break;
      case 'previous': if (state.active) moveQuestion(state.active.current - 1); break;
      case 'question': moveQuestion(Number(target.dataset.index)); break;
      case 'flag': toggleFlag(); break;
      case 'clear-answer': {
        if (!liveAttempt()) break;
        const q = activePaper().questions[state.active.current];
        if (!E.answered(q, state.active.answers[q.id])) { toast('This question is already unanswered.'); break; }
        if (q.type === 'written') openModal('clear-answer', 'Clear this response?', '<p class="modal-intro">This will remove the written answer for this question. Your other answers will stay saved.</p>', btn('Keep response', 'close-modal', 'secondary') + btn('Clear response', 'confirm-clear', 'danger'));
        else { delete state.active.answers[q.id]; save(); render(); toast('Answer cleared.'); }
        break;
      }
      case 'confirm-clear': if (liveAttempt()) { delete state.active.answers[activePaper().questions[state.active.current].id]; save(); closeModal(); render(); toast('Response cleared.'); } break;
      case 'submit-review': reviewSubmission(); break;
      case 'confirm-submit': submit(); break;
      case 'scratchpad': scratchpad(); break;
      case 'focus': focusMode = !focusMode; render(); toast(focusMode ? 'Focus mode on. A little more room to think.' : 'Welcome back to your workspace.'); break;
      case 'text-size': state.largeText = !state.largeText; save(); render(); break;
      case 'fill-demo': if (!state.active?.demo) break; if (answeredCount(state.active)) openModal('fill-demo', 'Use the sample responses?', '<p class="modal-intro">This replaces your current demo answers with prepared responses. The sample includes both correct and incorrect answers so you can demonstrate feedback.</p>', btn('Keep my answers', 'close-modal', 'secondary') + btn('Fill sample answers', 'confirm-fill', 'primary')); else fillDemo(); break;
      case 'confirm-fill': fillDemo(); break;
      case 'fast-timer': if (state.active?.demo) { state.active.deadline = Math.min(state.active.deadline, Date.now() + 15000); save(); updateTimer(); toast('Demo timer reduced to 15 seconds or less. Watch automatic submission.'); } break;
      case 'sample-report': sampleReport(); break;
      case 'filter': filter = target.dataset.filter; render(); break;
      case 'toggle-evaluator': evaluatorMode = !evaluatorMode; filter = evaluatorMode ? 'written' : 'all'; render(); toast(evaluatorMode ? 'Evaluator view: review each response before confirming its marks.' : 'Learner report restored.'); break;
      case 'evaluate': evaluate(target.dataset.id); break;
      case 'save-evaluation': saveEvaluation(); break;
      case 'export': exportReport(); break;
      case 'print': window.print(); break;
    }
  });
  document.addEventListener('change', event => {
    const el = event.target;
    if (el.id === 'accept-instructions') $('#begin-button').disabled = !el.checked;
    if (el.matches('input[name="answer"]') && liveAttempt()) {
      const q = activePaper().questions[state.active.current];
      if (q.type !== 'mcq') return;
      state.active.answers[q.id] = Number(el.value); save(); updateNavigator();
    }
    if (el.id === 'attempt-select') { state.selectedResult = el.value; evaluatorMode = false; save(); filter = 'all'; render(); }
  });
  document.addEventListener('input', event => {
    const el = event.target;
    if (['candidate-name', 'candidate-roll'].includes(el.id)) el.setCustomValidity('');
    if (el.id === 'written-answer' && liveAttempt()) {
      state.active.answers[activePaper().questions[state.active.current].id] = el.value;
      $('#word-count').textContent = `${wordCount(el.value)} ${wordCount(el.value) === 1 ? 'word' : 'words'}`; save(); updateNavigator();
    }
    if (el.id === 'scratchpad-notes' && liveAttempt()) { state.active.notes = el.value; save(); }
  });
  document.addEventListener('submit', event => {
    if (event.target.id !== 'registration-form') return;
    event.preventDefault();
    if (!$('#accept-instructions')?.checked) { $('#accept-instructions')?.focus(); return; }
    begin(modalKind === 'start-demo');
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape') { closeModal(); $('#sidebar')?.classList.remove('open'); $('.mobile-menu')?.setAttribute('aria-expanded', 'false'); }
    if (modalKind && event.key === 'Tab') {
      const focusable = [...$('#modal-root').querySelectorAll('button:not(:disabled), input:not(:disabled), textarea, select, [tabindex="0"]')];
      const first = focusable[0], last = focusable.at(-1);
      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last?.focus(); }
      else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first?.focus(); }
    }
    if (!modalKind && view === 'exam' && state.active && event.altKey && ['ArrowLeft', 'ArrowRight'].includes(event.key)) { event.preventDefault(); moveQuestion(state.active.current + (event.key === 'ArrowRight' ? 1 : -1)); }
  });
  document.addEventListener('click', event => {
    if (window.innerWidth <= 640 && !event.target.closest('#sidebar') && !event.target.closest('[data-action="menu"]')) { $('#sidebar')?.classList.remove('open'); $('.mobile-menu')?.setAttribute('aria-expanded', 'false'); }
  });
  window.addEventListener('hashchange', () => { if (suppressHash) { suppressHash = false; return; } navigate(location.hash.slice(1), false); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) updateTimer(); });
  window.addEventListener('pageshow', updateTimer);
  window.addEventListener('storage', event => {
    if (event.key !== KEY) return;
    closeModal(); state = initialState(); load();
    if (view === 'exam' && !state.active) view = state.history.length ? 'results' : 'overview';
    render(); toast('Workspace updated from another browser tab.');
  });
  let printFilter;
  window.addEventListener('beforeprint', () => {
    if (view !== 'results' || !currentResult()) return;
    printFilter = filter; filter = 'all'; render(); document.querySelectorAll('.review-item').forEach(el => el.open = true);
  });
  window.addEventListener('afterprint', () => { if (printFilter !== undefined) { filter = printFilter; printFilter = undefined; render(); } updateTimer(); });
  load();
  view = location.hash.slice(1) || (state.active ? 'exam' : 'overview');
  if (!['overview', 'paper', 'exam', 'results', 'guide'].includes(view)) view = 'overview';
  if (view === 'exam' && !state.active) view = state.history.length ? 'results' : 'overview';
  if (state.active && !state.active.demo && ['paper', 'results'].includes(view)) view = 'exam';
  render();
  setInterval(updateTimer, 500);
})();
</script>
</body>
</html>
